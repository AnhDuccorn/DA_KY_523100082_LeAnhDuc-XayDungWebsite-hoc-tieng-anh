<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="auth-page"><div class="auth-card">
<section class="auth-left"><h2>📖 Học Tiếng Anh Online</h2><div class="auth-visual">👨🏻‍💻📚</div><h1>Chào mừng bạn!</h1><p>Học tiếng Anh mọi lúc, mọi nơi với nội dung phong phú, bài tập đa dạng và lộ trình học phù hợp.</p></section>
<section class="auth-right"><h1>Đăng nhập</h1><p class="muted">Đăng nhập để tiếp tục học tập và làm bài tập</p>
<form id="loginForm"><label>Tên đăng nhập hoặc Email</label><input class="input" id="account" placeholder="👤  Nhập tên đăng nhập hoặc email"><label>Mật khẩu</label><input class="input" id="password" type="password" placeholder="🔒  Nhập mật khẩu">
<div style="display:flex;justify-content:space-between;margin:5px 0 18px"><label><input type="checkbox"> Ghi nhớ đăng nhập</label><a style="color:#2d74df">Quên mật khẩu?</a></div>
<button class="btn btn-primary" style="width:100%;padding:14px">Đăng nhập</button></form><p id="msg" style="color:#d44"></p>
<div style="text-align:center;margin:23px 0;color:#98a3b5">──────── Hoặc đăng nhập bằng ────────</div>
<div style="display:flex;gap:10px"><button class="btn btn-light" style="flex:1">G Google</button><button class="btn btn-light" style="flex:1">f Facebook</button></div>
<p style="text-align:center;margin-top:25px">Chưa có tài khoản? <a href="/register.html" style="color:#2d74df;font-weight:700">Đăng ký ngay</a></p></section>
</div><script src="/js/app.js"></script><script>
loginForm.onsubmit=async e=>{e.preventDefault();msg.textContent="";try{const data=await api("/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({account:account.value,password:password.value})});localStorage.setItem("token",data.token);localStorage.setItem("user",JSON.stringify(data.user));location.href=data.user.role==="admin"?"/admin.html":"/dashboard.html"}catch(err){msg.textContent=err.message}}
</script></body></html>
