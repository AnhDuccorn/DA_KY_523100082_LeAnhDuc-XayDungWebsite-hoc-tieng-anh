<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="auth-page"><div class="auth-card"><section class="auth-left"><h2>📖 Học Tiếng Anh Online</h2><div class="auth-visual">✍️📘</div><h1>Bắt đầu học ngay!</h1><p>Tạo tài khoản để lưu kết quả, theo dõi tiến độ và học tiếng Anh mỗi ngày.</p></section>
<section class="auth-right"><h1>Đăng ký</h1><p class="muted">Tạo tài khoản người học mới</p><form id="f">
<input class="input" id="fullName" placeholder="Họ và tên"><input class="input" id="username" placeholder="Tên đăng nhập"><input class="input" id="email" type="email" placeholder="Email"><input class="input" id="password" type="password" placeholder="Mật khẩu">
<button class="btn btn-primary" style="width:100%;padding:14px">Đăng ký</button></form><p id="msg"></p><p style="text-align:center">Đã có tài khoản? <a href="/login.html" style="color:#2d74df;font-weight:700">Đăng nhập</a></p></section></div>
<script src="/js/app.js"></script><script>f.onsubmit=async e=>{e.preventDefault();try{const d=await api("/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fullName:fullName.value,username:username.value,email:email.value,password:password.value})});msg.textContent=d.message;setTimeout(()=>location.href="/login.html",800)}catch(err){msg.textContent=err.message}}</script></body></html>
